# ---------------------------------------------------------------------------
# Cookie-based authentication in front of ttyd
#
# WHY THIS EXISTS
#   HTTP Basic auth cannot protect a WebSocket. A browser only attaches Basic
#   credentials after a 401 challenge *on that request*, and a WebSocket
#   handshake has no way to prompt the user — so the upgrade always fails on
#   clients that do not reuse the credentials cached from the page load.
#   Measured here: the page returns 200 and the WebSocket returns 101 when
#   credentials are supplied, while Safari's upgrade is refused. Chrome and
#   Firefox happen to reuse cached credentials, Safari does not, which is why
#   "desktop works, iPhone doesn't".
#
#   Cookies ARE sent on a WebSocket handshake, so authenticate once over HTTP
#   (where a 401 prompt works), then let the session cookie carry the upgrade.
#
# TOPOLOGY (no change needed on the N100)
#   browser -> N100 nginx (proxy to Pi:7681) -> THIS server block on the Pi
#           -> ttyd on 127.0.0.1:7682 (NO auth of its own)
#
#   This block therefore takes over port 7681 on the Pi, and ttyd moves to a
#   loopback-only port. ttyd must NOT be reachable except through here: it no
#   longer authenticates anything itself.
#
# SECURITY MODEL
#   - ttyd binds 127.0.0.1 only, so the only way in is through this block.
#   - The cookie is a shared secret issued only after a successful Basic auth.
#     Nothing client-supplied is trusted as a proxy header, so there is no
#     header-forgery bypass (unlike the old `-H X-Copilot-Auth` scheme, where
#     ttyd accepted any non-empty value).
#   - Keep the cookie value secret: anyone who learns it can skip the password.
#
# PART 1 must live in the `http` context; PART 2 is the server block.
# ---------------------------------------------------------------------------


# --- PART 1 — http context -------------------------------------------------
#
# `proxy_set_header Connection` must vary with the request, otherwise keep-alive
# to ttyd breaks on ordinary requests while the upgrade needs "upgrade".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Match the session cookie against the secret. A cookie of any other value
# (including an attacker-chosen one) maps to 0 and is rejected.
map $cookie_cw_session $cw_authenticated {
    default     0;
    "<REPLACE_WITH_SESSION_SECRET>" 1;
}


# --- PART 2 — server block -------------------------------------------------
#
# Takes over the port the N100 forwards to, and proxies to a loopback-only ttyd.

server {
    # All interfaces, deliberately: nginx enforces the auth here, and binding
    # 0.0.0.0 avoids the DHCP-address fragility that binding one LAN IP has
    # (the N100 forwards to this port, and the address can change under DHCP).
    # ttyd, which no longer authenticates, is the one that must stay on loopback.
    listen 7681;
    server_name _;

    # CRITICAL. nginx rewrites `return 302 /path` into an ABSOLUTE url built from
    # $scheme, $host and its own listen port. Behind a TLS-terminating proxy
    # that produces "http://<host>:7681/cw-login" — the wrong scheme for an
    # https page, and an internal port that is not publicly exposed, so the
    # browser is sent somewhere unreachable. Emit relative redirects and let the
    # browser resolve them against the real origin.
    absolute_redirect off;
    port_in_redirect off;

    # Long-lived terminal: do not let nginx time the WebSocket out.
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;

    # --- the one place a password is ever asked for -------------------------
    #
    # A normal page load gets a real 401 challenge here, which every browser
    # (Safari included) can satisfy. Success issues the session cookie and
    # returns to the console. `/cw-login` is deliberately NOT reachable through
    # the catch-all below, so it can never be proxied to ttyd.
    location = /cw-login {
        auth_basic           "Copilot";
        auth_basic_user_file /etc/nginx/copilot.htpasswd;

        # Persist the cookie: iOS drops *session* cookies when Safari is
        # backgrounded, and a missing cookie turns the WebSocket handshake into
        # a redirect — which looks exactly like the "reconnect" failure this is
        # meant to fix. 7 days balances that against a long-lived bypass.
        # No `Secure`: the LAN URL is plain http, and the public URL is https,
        # where the browser still sends an insecure cookie over TLS.
        add_header Set-Cookie "cw_session=<REPLACE_WITH_SESSION_SECRET>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax" always;

        return 302 /;
    }

    # --- everything else, including /ws and /token -------------------------
    location / {
        if ($cw_authenticated = 0) {
            return 302 /cw-login;
        }

        proxy_pass http://127.0.0.1:7682;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Stream the terminal rather than buffering it, and do not let nginx
        # close an idle console.
        proxy_buffering off;
    }
}

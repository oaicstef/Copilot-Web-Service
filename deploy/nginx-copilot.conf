# ---------------------------------------------------------------------------
# Copilot web console — reverse-proxy auth + brute-force protection
#
# Used with nginx-proxy-manager (NPM) in front of copilot-web (ttyd) after
# running `sudo ./install.sh --auth-header X-Copilot-Auth`.
#
# Before this works, ttyd must stop checking its own credential: that is what
# `--auth-header` does in install.sh (it writes TTYD_AUTH_HEADER into
# /etc/copilot-ttyd/env and comments TTYD_CREDENTIAL out).
#
# The config is in two parts because nginx only accepts `limit_req_zone` in the
# `http` context.
# ---------------------------------------------------------------------------


# --- PART 1 — http context ------------------------------------------------
#
# NPM:      /data/nginx/custom/http.conf   (create/append, then restart NPM)
# plain:    the `http { ... }` block of nginx.conf
#
# 10 requests per minute per client IP. `burst=5` with `nodelay` lets a normal
# user reload a few times before anything is queued, while a password-guessing
# loop is throttled to 10 tries/minute. 10m of state tracks ~160k addresses.

limit_req_zone $binary_remote_addr zone=copilot_login:10m rate=10r/m;


# --- PART 2 — server / location context ----------------------------------
#
# NPM:      the proxy host's "Advanced" tab
# plain:    inside the site's `location / { ... }` block
#
# Authentication itself is NPM's job: attach an "Access List" to the proxy host
# (that is what writes auth_basic / auth_basic_user_file). With plain nginx use
# auth_basic + auth_basic_user_file here instead.

# Throttle login attempts for this site.
limit_req zone=copilot_login burst=5 nodelay;
limit_req_status 429;

# ttyd is started with `-H X-Copilot-Auth`, so it trusts the header and checks
# only that it is present and non-empty. Setting the header here REPLACES
# whatever the client sent (nginx does not forward a client header whose value
# was overridden), which is what stops a client forging it.
#
# The value is copied from TTYD_AUTH_HEADER_VALUE in /etc/copilot-ttyd/env:
#   sudo grep TTYD_AUTH_HEADER_VALUE /etc/copilot-ttyd/env
proxy_set_header X-Copilot-Auth "REPLACE_WITH_TTYD_AUTH_HEADER_VALUE";

# Keep the WebSocket upgrade and let an idle console stay open.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 7d;
proxy_send_timeout 7d;
